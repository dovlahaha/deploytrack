version: 2.1

jobs:
  test:
    docker:
      - image: cimg/go:1.24
    steps:
      - checkout
      - run:
          name: Download dependencies
          command: go mod download
      - run:
          name: Build
          command: go build ./...
      - run:
          name: Unit tests
          command: go test ./internal/metrics/...

workflows:
  build-and-test:
    jobs:
      - test
