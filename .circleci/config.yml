version: 2.1

jobs:
  build-ci-image:
    docker:
      - image: cimg/base:2024.01
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build and push CI image
          command: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker build -t ghcr.io/dovlahaha/deploytrack-ci:<< pipeline.git.revision >> -f Dockerfile.ci .
            docker push ghcr.io/dovlahaha/deploytrack-ci:<< pipeline.git.revision >>

  test:
    docker:
      - image: ghcr.io/dovlahaha/deploytrack-ci:<< pipeline.git.revision >>
      - image: cimg/postgres:16.2
        environment:
          POSTGRES_USER: deploytrack
          POSTGRES_PASSWORD: deploytrack
          POSTGRES_DB: deploytrack
    environment:
      TEST_DATABASE_URL: postgres://deploytrack:deploytrack@localhost:5432/deploytrack?sslmode=disable
      TEST_RESULTS: /tmp/test-results
    steps:
      - checkout
      - run:
          name: Download dependencies
          command: go mod download
      - run:
          name: Build
          command: go build ./...
      - run:
          name: Wait for Postgres
          command: bash scripts/wait-for-db.sh localhost 5432
      - run:
          name: Run tests
          command: |
            mkdir -p "$TEST_RESULTS"
            gotestsum --junitfile "$TEST_RESULTS/gotestsum-report.xml" -- ./...
      - store_test_results:
          path: /tmp/test-results
      - store_artifacts:
          path: /tmp/test-results

workflows:
  build-and-test:
    jobs:
      - build-ci-image:
          context: ghcr
      - test:
          requires:
            - build-ci-image
