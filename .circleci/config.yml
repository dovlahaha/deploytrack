version: 2.1
setup: true

orbs:
  path-filtering: circleci/path-filtering@1.3.0

workflows:
  setup:
    jobs:
      - path-filtering/filter:
          name: check-updated-files
          base-revision: main
          config-path: .circleci/continue_config.yml
          mapping: |
            Dockerfile\.ci                  rebuild-ci-image  true
            .*\.go|go\.mod|go\.sum          code-changed      true
            .*                              always-run        true
